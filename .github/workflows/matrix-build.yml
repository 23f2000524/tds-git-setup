name: Multi-Platform Matrix Build (f4310a6)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [16, 18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: matrix-f4310a6
        run: echo "Building for OS=${{ matrix.os }} | Node=${{ matrix.node-version }}"

      - name: Generate build artifact
        run: echo "Build artifact for OS=${{ matrix.os }}, Node=${{ matrix.node-version }}" > output.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-f4310a6-${{ matrix.os }}-node${{ matrix.node-version }}
          path: output.txt
